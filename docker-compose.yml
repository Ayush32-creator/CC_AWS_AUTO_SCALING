# Local development stack: PostgreSQL 16 + the checkout app (API + built React UI).
#   docker compose up --build        -> http://localhost:3000
#   docker compose down              -> stop (data kept in the "pgdata" volume)
#   docker compose down -v           -> stop and delete local data

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-checkout}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # localhost only, for tests/psql
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: local
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-checkout}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s   # matches the app's graceful-shutdown window

volumes:
  pgdata:
